<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            display: flex;
            background-color: antiquewhite;
            height: 100vh;
            width: 100vw;
            position: relative;
            margin: auto;
        }
     .card1{
       height: 100px;
       width: 100px;
       background-color: blue;
       color: white;
      position: absolute;
      top: 50%;
      left: 50%;
     }
     .card2{
        height: 100px;
        width: 100px;
        background-color: brown;
        color: white;
       top: 0;
       right: 0;
      position: absolute;
     }
         .card3{
        height: 100px;
        width: 100px;
        background-color: rgb(255, 2, 2);
        color: white;
    position: absolute;
    
     }
         .card4{
        height: 100px;
        width: 100px;
        background-color: black;
        color: white;
        position: absolute;
        left: 0;
        bottom: 0;
     }
         .card5{
        height: 100px;
        width: 100px;
        background-color: yellow;
        color: rgb(0, 0, 0);
        position: absolute;
        right: 0;
        bottom: 0;
     }
      
    </style>
</head>
<body>
    <div class="main">
   <div class="card1">Blue</div>
   <div class="card2">Brown</div>
   <div class="card3">Red</div>
   <div class="card4">Black</div>
   <div class="card5">yellow</div>
   </div>
</body>
</html>
