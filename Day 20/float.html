<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            border: 2px solid black;
        }
        .left{
            float: left;
        }
        .right{
            float: right;
        }

        img{
            height: 100px;
            width: 100px;

        }
        p{
            clear: both;
        }

    </style>
</head>
<body>
    <div>
        <img class="left" src="../Day-5/images/image.webp" alt="">
        <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. A corporis possimus natus delectus nulla, totam, molestiae ad consequuntur quaerat culpa praesentium ab veniam reprehenderit. Tempore temporibus magnam nesciunt vel iusto?</p>
       <img class="right" src="../Day-5/images/image.webp" alt="">

    </div>
</body>
</html>
